<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | PS Digital Studios</title>
<meta name="description" content="Get in touch with PS Digital Studios on WhatsApp or Instagram to start your website.">
<meta name="theme-color" content="#0a0c22">
<meta property="og:title" content="Contact | PS Digital Studios">
<meta property="og:description" content="Get in touch with PS Digital Studios on WhatsApp or Instagram to start your website.">
<meta property="og:type" content="website">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header class="site-header" id="site-header"></header>
<main id="main">
<section class="page-hero"><div class="wrap"><p class="eyebrow">Contact</p><h1>Let's talk about your website</h1><p>Message us on WhatsApp for the quickest reply, or fill in the form and we'll open the chat for you.</p></div></section>
<section class="section"><div class="wrap split">
  <div class="contact-cards" data-render="contact-cards"></div>
  <div class="card form-card">
    <h2>Send us a message</h2>
    <p>Tell us a little about your business. Pressing send opens WhatsApp with your message ready to go.</p>
    <form id="contact-form">
      <div class="field"><label for="ct-name">Your name</label><input id="ct-name" name="name" required autocomplete="name"></div>
      <div class="field"><label for="ct-biz">Business name (optional)</label><input id="ct-biz" name="business" autocomplete="organization"></div>
      <div class="field"><label for="ct-msg">What do you need?</label><textarea id="ct-msg" name="message" required placeholder="For example: I run a salon and need a website with bookings."></textarea></div>
      <button class="btn btn-wa" type="submit">Continue on WhatsApp</button>
    </form>
  </div>
</div></section>
</main>
<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
